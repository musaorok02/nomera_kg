{% if page.paginator.num_pages > 1 %}
<div class="pager">
  {% if page.has_previous %}<a class="chip" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page.previous_page_number }}">← Назад</a>{% endif %}
  <span class="muted">Страница {{ page.number }} из {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="chip" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page.next_page_number }}">Вперёд →</a>{% endif %}
</div>
{% endif %}
